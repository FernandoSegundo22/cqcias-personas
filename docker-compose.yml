services:

  database:
    image: mysql:8.4
    container_name: cqcias-mysql

    environment:
      MYSQL_DATABASE: CQCIAS
      MYSQL_USER: cqcias_user
      MYSQL_PASSWORD: cqcias_password
      MYSQL_ROOT_PASSWORD: root_password

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: