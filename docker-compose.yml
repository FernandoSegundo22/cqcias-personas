services:

  database:
    image: mysql:8.4
    container_name: cqcias-mysql

    environment:
      MYSQL_DATABASE: CQCIAS
      MYSQL_USER: cqcias_user
      MYSQL_PASSWORD: cqcias_password
      MYSQL_ROOT_PASSWORD: root_password

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend

    container_name: cqcias-backend

    environment:
      DB_URL: jdbc:mysql://database:3306/CQCIAS
      DB_USERNAME: cqcias_user
      DB_PASSWORD: cqcias_password

    ports:
      - "8080:8080"

    depends_on:
      database:
        condition: service_healthy
    
    restart: on-failure

  frontend:
      build:
        context: ./frontend

      container_name: cqcias-frontend

      ports:
        - "80:80"

      depends_on:
        - backend

volumes:
  mysql_data: